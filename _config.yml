# GitHub Pages Configuration with Jekyll Minimal Theme
# Theme: https://github.com/pages-themes/minimal
theme: jekyll-theme-minimal

title: Superpowers for Google Antigravity
description: The definitive Superpowers SOP & 24-skill library for Google Antigravity (agy). Design-first brainstorming, atomic plans, TDD execution, and production engineering workflows.

# Layout Settings
show_downloads: true
google_analytics:

# Markdown Settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Exclude internal non-website assets & documentation to prevent Liquid parsing errors
exclude:
  - .agent/
  - .gemini/
  - adapters/
  - antigravity/
  - docs/
  - examples/
  - tests/
  - scripts/
  - node_modules/
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
  - vendor/
